<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHG Thanksgiving Bingo</title><style>
:root{--rust:#a53f1f;--gold:#e8b23d;--green:#315f3b;--brown:#5b3521}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(145deg,#f4c778,#9f3f29);min-height:100vh;color:#2f241d}.app{width:min(1080px,96%);margin:auto;padding:20px}.panel{background:#fffdf6;border:4px solid var(--brown);border-radius:22px;padding:20px}h1,h2{text-align:center;color:var(--rust)}.sub{text-align:center;color:var(--green);font-weight:700}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px}button{border:0;border-radius:999px;padding:11px 16px;background:var(--green);color:white;font-weight:800;cursor:pointer}button.rust{background:var(--rust)}button.gold{background:#c98216}.screen{display:none}.active{display:block}.headers,.grid,.fullgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.headers div{background:var(--rust);color:#fff;text-align:center;padding:8px;border-radius:8px;font-size:1.5rem;font-weight:900}.cell,.fullcell{position:relative;background:#fff8e8;border:2px solid #8b512c;border-radius:9px;min-height:96px;padding:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;cursor:pointer;overflow:hidden}.fullcol{display:grid;gap:5px;align-content:start}.fullcell{min-height:58px;font-size:.82rem}.marked,.called{background:#f6d28c}.marked:after,.called:after{content:'STAMPED';position:absolute;inset:5px;display:grid;place-items:center;border:4px solid rgba(140,37,19,.72);border-radius:50%;transform:rotate(-10deg);color:#8c2513;font-weight:1000;background:rgba(140,37,19,.10)}.called:after{content:'CALLED';font-size:.7rem;border-width:3px}.cell span,.fullcell span{z-index:1}.status{text-align:center;color:var(--green);font-weight:800;margin:10px}.callerbox{text-align:center;background:#fff1ce;border:3px solid var(--gold);border-radius:18px;padding:18px}.current{font-size:2.3rem;color:var(--rust);font-weight:900;margin:12px}.history{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px}.history div{background:#fff8e8;border-left:5px solid #d87322;padding:8px}@media(max-width:620px){.app{width:100%;padding:0}.panel{border:0;border-radius:0;padding:10px}.cell{min-height:90px;font-size:.72rem}.fullcell{min-height:66px;font-size:.59rem;padding:3px}.headers,.grid,.fullgrid{gap:3px}}
</style></head><body><main class="app"><div class="panel"><h1>🍁 AHG Thanksgiving Bingo 🍂</h1><div class="sub">American Heritage Girls</div>
<section id="player" class="screen active"><div class="toolbar"><button id="new">New Random Card</button><button class="rust" id="clear">Clear Stamps</button><button class="gold" onclick="show('caller')">Bingo Caller</button><button class="rust" onclick="show('full')">Full Card</button></div><div class="headers"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div id="card" class="grid"></div><div id="win" class="status"></div></section>
<section id="full" class="screen"><div class="toolbar"><button onclick="show('player')">Player Card</button><button class="gold" onclick="show('caller')">Bingo Caller</button><button class="rust" id="clearFull">Clear Full Card</button></div><h2>Full Card</h2><p class="sub">Manual Caller Tracker: all 75 words. Click a word when it is called. Click it again to undo.</p><div class="headers"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div id="fullgrid" class="fullgrid"></div><div id="fullcount" class="status"></div></section>
<section id="caller" class="screen"><div class="toolbar"><button onclick="show('player')">Player Card</button><button class="rust" onclick="show('full')">Full Card</button><button class="gold" id="draw">Draw Next Word</button><button id="reset">Reset Caller</button></div><div class="callerbox"><div id="current" class="current">Ready to draw!</div><div id="remain"></div></div><h2>Called Words</h2><div id="history" class="history"></div></section></div></main>
<script>const columns={"B": ["mashed potatoes", "turkey", "bread", "applesauce", "lamb", "duck", "chicken", "green beans", "asparagus", "Brussels sprouts", "salad", "cranberry sauce", "dinner rolls", "stuffing", "sweet potatoes"], "I": ["Plymouth", "deer", "Mayflower", "Puritans", "Speedwell", "Cape Cod", "pilgrims", "William Bradford", "harvest", "colonies", "Squanto", "Chief Massasoit", "Governor Carver", "turkeys", "waterfowl"], "N": ["St. Frances Cabrini", "St. Leo the Great", "St. Charles Borromeo", "St. Martin de Porres", "St. Elizabeth of Hungary", "St. Cecilia", "St. Catherine Labouré", "St. Andrew", "St. Martin of Tours", "Bl. Miguel Agustín Pro", "St. Rose Philippine Duchesne", "St. Gertrude", "St. Christopher", "St. Margaret of Scotland", "St. Francesco"], "G": ["Maple Tree", "Oak Tree", "Magnolia Tree", "Weeping Willow", "Elm Tree", "Dogwood Tree", "Pine Tree", "Lilac Tree", "Cherry Tree", "Apple Tree", "Pear Tree", "Birch Tree", "Sycamore Tree", "Evergreen Trees", "Deciduous Trees"], "O": ["Apple pie", "Pecan Pie", "Apple cider", "Oreo cookies", "Pumpkin Pie", "Hot Chocolate", "Whipped Cream", "Pumpkin bread", "Zucchini bread", "Lemon Meringue Pie", "Berry Pie", "Soda", "water", "apple juice", "sparkling juice"]};const all=Object.entries(columns).flatMap(([letter,words])=>words.map(word=>({letter,word})));let card=JSON.parse(localStorage.getItem('ahgCard3')||'null'),marks=new Set(JSON.parse(localStorage.getItem('ahgMarks3')||'[]')),calls=JSON.parse(localStorage.getItem('ahgCalls3')||'[]'),manual=new Set(JSON.parse(localStorage.getItem('ahgManual3')||'[]'));const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function save(){localStorage.setItem('ahgCard3',JSON.stringify(card));localStorage.setItem('ahgMarks3',JSON.stringify([...marks]));localStorage.setItem('ahgCalls3',JSON.stringify(calls));localStorage.setItem('ahgManual3',JSON.stringify([...manual]))}function make(){let c={};for(const l of 'BINGO')c[l]=shuffle(columns[l]).slice(0,5);card=[];for(let r=0;r<5;r++)for(const l of 'BINGO')card.push(l==='N'&&r===2?{letter:l,word:'Gobble Gobble',free:true}:{letter:l,word:c[l][r]});marks=new Set(['Gobble Gobble']);save();render()}function render(){let e=document.getElementById('card');e.innerHTML='';card.forEach(x=>{let d=document.createElement('div');d.className='cell'+(marks.has(x.word)?' marked':'');d.innerHTML='<span>'+x.word+'</span>';d.onclick=()=>{marks.has(x.word)?marks.delete(x.word):marks.add(x.word);save();render()};e.appendChild(d)});check()}function check(){let m=card.map(x=>marks.has(x.word)),w=false;for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>m[r*5+c]))w=true;for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>m[r*5+c]))w=true;if([0,6,12,18,24].every(i=>m[i])||[4,8,12,16,20].every(i=>m[i]))w=true;document.getElementById('win').textContent=w?'🎉 BINGO!':''}function renderFull(){let g=document.getElementById('fullgrid');g.innerHTML='';for(const l of 'BINGO'){let col=document.createElement('div');col.className='fullcol';columns[l].forEach(word=>{let d=document.createElement('div');d.className='fullcell'+(manual.has(word)?' called':'');d.innerHTML='<span>'+word+'</span>';d.onclick=()=>{manual.has(word)?manual.delete(word):manual.add(word);save();renderFull()};col.appendChild(d)});g.appendChild(col)}document.getElementById('fullcount').textContent=manual.size+' of 75 words marked as called'}function renderCaller(){document.getElementById('history').innerHTML=calls.length?calls.map((x,i)=>'<div><b>'+(i+1)+'. '+x.letter+'</b><br>'+x.word+'</div>').join(''):'No words called yet.';document.getElementById('remain').textContent=(75-calls.length)+' of 75 remaining';document.getElementById('current').textContent=calls.length?calls[calls.length-1].word:'Ready to draw!'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='full')renderFull();if(id==='caller')renderCaller();scrollTo(0,0)}document.getElementById('new').onclick=()=>make();document.getElementById('clear').onclick=()=>{marks=new Set(['Gobble Gobble']);save();render()};document.getElementById('clearFull').onclick=()=>{manual.clear();save();renderFull()};document.getElementById('draw').onclick=()=>{let left=all.filter(x=>!calls.some(c=>c.word===x.word));if(!left.length)return alert('All 75 words have been called.');calls.push(left[Math.floor(Math.random()*left.length)]);save();renderCaller()};document.getElementById('reset').onclick=()=>{calls=[];save();renderCaller()};if(!card||card.length!==25)make();else render();</script></body></html>
